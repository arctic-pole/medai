[project]
name = "medai-backend"
version = "0.1.0"
description = "MEDAI backend — FastAPI service implementing medai_spec.yaml"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "cryptography>=43",
    "openai>=1.50",
    # EmbeddingProvider concrete choice: BAAI/bge-large-en-v1.5, self-hosted, no API key.
    # Install CPU-only torch FIRST (see README) to avoid pulling a multi-GB CUDA wheel:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "sentence-transformers>=3.0",
    # VectorStore concrete choice: pgvector (already the Postgres image in docker-compose.yml).
    "pgvector>=0.3",
    # MedicalKnowledgeProvider (MedlinePlus) — real HTTP calls at runtime now, not just tests.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
