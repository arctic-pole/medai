services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medai}
      POSTGRES_DB: ${POSTGRES_DB:-medai}
    ports:
      - "5432:5432"
    volumes:
      - medai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medai_pgdata:
