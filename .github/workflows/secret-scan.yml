name: secret-scan

# Phase 13 (security_hardening: secrets_management). Runs across the whole repo, not scoped to
# backend/ or mobile/ paths — a leaked credential could land anywhere (a doc, a script, a
# .env.example edit gone wrong). Free for personal-account repos (this one); an org repo would
# need a GITLEAKS_LICENSE secret per https://github.com/gitleaks/gitleaks-action.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # catches a secret that reached history before this workflow existed

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
